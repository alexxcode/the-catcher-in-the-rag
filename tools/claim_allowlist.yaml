# Lista blanca de valores numéricos estáticos permitidos en documentación
# Permite años, versiones, puertos, constantes estructurales y números de sección/RFC.
# Cualquier métrica empírica DEBE estar dentro de bloques <!-- GEN:<nombre> -->...<!-- /GEN -->.

