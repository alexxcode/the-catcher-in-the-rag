  - "4.0"
  - "5"
  - "13"
  # Tamaños y límites de cuota
  - "50000"
  - "50,000"
  - "80000"
  - "80,000"
  - "175000"
  - "175,000"
  - "175.000"
  - "1000000"
  - "1M"
  - "0.00"
  - "$0.00"
  - "$50,000"
  - "$50000"
  - "50%"
  - "80%"
  - "100%"


allowed_regexes:
  - '^A\d{2}$'              # Códigos de anomalía A01..A10
  - '^\d+\s*MB$'            # Tamaños de archivos (ej. 50 MB)
  - '^\d+\s*k$'             # Rangos (ej. 50k, 1k)
  - '^\d+d$'                # Dimensiones vectoriales (ej. 384d, 768d)

# No total file exemptions: all markdown files are audited.
exempt_files: []

