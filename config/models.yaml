# ── Model configuration ───────────────────────────────────────────────────────
# IMPORTANT: Pinned exact GA active model IDs.
# Note: Gemini 2.5 Pro / Flash reached retirement in Vertex AI on October 20, 2026.
# Pinned to active GA model family: gemini-3.5-flash
# Verified against:
#   https://cloud.google.com/vertex-ai/generative-ai/docs/learn/model-versioning
#
# Production Active GA Models (Verified in Vertex AI):
# - extraction_llm: gemini-3.5-flash (Active GA, retirement: May 19, 2027 or later, available in us-central1)
# - alternative_llm: gemini-3.8-flash (Active GA, retirement: September 2, 2027 or later, regions: global, us, eu)
# - embeddings: text-embedding-005 (Active GA, 768 dims, available in us-central1)
# - datagen_llm: gemini-3.5-flash (Active GA, temperature 0.7 for synthetic diversity)

project: the-catcher-in-the-rag   # overridden by env var GOOGLE_CLOUD_PROJECT
region: us-central1                # overridden by env var GOOGLE_CLOUD_REGION

# ── LLM models ────────────────────────────────────────────────────────────────
extraction_llm:
  provider: vertex_ai
  model_id: "gemini-3.5-flash"
  retirement_date: "2027-05-19"
  supported_regions: ["us-central1", "us-east4", "europe-west1"]
  temperature: 0.0   # deterministic extraction
  thinking_budget: 0  # minimize latency and token consumption for structured extraction

clause_llm:
  provider: vertex_ai
  model_id: "gemini-3.5-flash"
  retirement_date: "2027-05-19"
  supported_regions: ["us-central1", "us-east4", "europe-west1"]
  temperature: 0.0
  thinking_budget: 0  # low latency verification guard

alternative_llm:
  provider: vertex_ai
  model_id: "gemini-3.8-flash"
  retirement_date: "2027-09-02"
  supported_regions: ["global", "us-central1"]
  temperature: 0.0

# ── Embedding model ───────────────────────────────────────────────────────────
embeddings:
  provider: vertex_ai
  model_id: "text-embedding-005"
  output_dimensionality: 768   # reduced from 3072 for storage efficiency
  task_type: "RETRIEVAL_DOCUMENT"   # for indexing; use RETRIEVAL_QUERY at query time

# ── Generation rules ──────────────────────────────────────────────────────────
# Only GA models for synthetic dataset generation and published results.
datagen_llm:
  provider: vertex_ai
  model_id: "gemini-3.5-flash"
  temperature: 0.7   # variation for synthetic diversity
