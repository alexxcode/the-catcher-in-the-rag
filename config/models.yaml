# ── Model configuration ───────────────────────────────────────────────────────
# IMPORTANT: Pinned exact GA model IDs as per Phase 3 specifications.
# GA status verified against:
#   https://cloud.google.com/vertex-ai/generative-ai/docs/learn/model-versioning
#
# Production GA Models:
# - extraction_llm: gemini-2.0-flash-001 (GA, fast, deterministic schema extraction)
# - clause_llm: gemini-1.5-pro-002 (GA, complex clause reasoning)
# - embeddings: text-embedding-005 (GA, 768-dim retrieval embeddings)
# - reranker: flashrank (ms-marco-TinyBERT-L-2-v2, fast CPU-only local reranker)
# - datagen_llm: gemini-2.0-flash-001 (GA, temperature 0.7 for synthetic variation)

project: the-catcher-in-the-rag   # overridden by env var GOOGLE_CLOUD_PROJECT
region: us-central1                # overridden by env var GOOGLE_CLOUD_REGION

# ── LLM models ────────────────────────────────────────────────────────────────
extraction_llm:
  provider: vertex_ai
  model_id: "gemini-2.0-flash-001"
  temperature: 0.0   # deterministic extraction

clause_llm:
  provider: vertex_ai
  model_id: "gemini-1.5-pro-002"
  temperature: 0.0

# ── Embedding model ───────────────────────────────────────────────────────────
embeddings:
  provider: vertex_ai
  model_id: "text-embedding-005"
  output_dimensionality: 768   # reduced from 3072 for storage efficiency
  task_type: "RETRIEVAL_DOCUMENT"   # for indexing; use RETRIEVAL_QUERY at query time

# ── Reranker ──────────────────────────────────────────────────────────────────
reranker:
  provider: "flashrank"
  model_id: "ms-marco-TinyBERT-L-2-v2"

# ── Generation rules ──────────────────────────────────────────────────────────
# Only GA models for synthetic dataset generation and published results.
datagen_llm:
  provider: vertex_ai
  model_id: "gemini-2.0-flash-001"
  temperature: 0.7   # variation for synthetic diversity
