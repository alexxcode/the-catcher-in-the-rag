[project]
name = "catcher-in-the-rag"
version = "0.1.0"
description = "Audit agent for procurement documents: checks invoices against POs and contract clauses, cites the exact clause, evaluated with a reproducible harness."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "alexxcode" }]
keywords = ["rag", "procurement", "audit", "langgraph", "gemini", "gcp"]

dependencies = [
    # ── Agent orchestration ────────────────────────────────────────────────────
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=1.0",
    "langchain-core>=0.3",
    "langchain-google-vertexai>=1.0",

    # ── Schemas & validation ───────────────────────────────────────────────────
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",

    # ── API ────────────────────────────────────────────────────────────────────
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",

    # ── Retrieval ──────────────────────────────────────────────────────────────
    "rank-bm25>=0.2.2",

    # ── Evaluation ────────────────────────────────────────────────────────────
    "ragas>=0.1",

    # ── Tracing ───────────────────────────────────────────────────────────────
    "langfuse>=2.0",

    # ── GCP ───────────────────────────────────────────────────────────────────
    "google-cloud-aiplatform>=1.70",
    "google-cloud-storage>=2.18",
    "google-cloud-secret-manager>=2.20",

    # ── Database (Cloud SQL + pgvector) ───────────────────────────────────────
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "sqlalchemy>=2.0",

    # ── UI ────────────────────────────────────────────────────────────────────
    "streamlit>=1.40",

    # ── Utilities ─────────────────────────────────────────────────────────────
    "python-dotenv>=1.0",
    "structlog>=24.4",
    "httpx>=0.27",
    "tenacity>=8.2",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catcher_in_the_rag"]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "PTH", "ANN"]
ignore = ["E501", "ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["catcher_in_the_rag"]

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/catcher_in_the_rag --cov-report=term-missing -q"

