name: Model Lifecycle Canary

on:
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13"

jobs:
  check-model-availability:
    name: Vertex AI Model Deprecation Canary
    runs-on: ubuntu-latest
    env:
      WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: gcp_auth
        if: env.WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Run Model Lifecycle Canary against Vertex AI
        run: |
          echo "Checking active GA models pinned in config/models.yaml..."
          uv run python -c "
          import os
          has_creds = bool(os.getenv('GOOGLE_APPLICATION_CREDENTIALS') or os.getenv('CLOUDSDK_AUTH_ACCESS_TOKEN'))
          wif_configured = bool(os.getenv('WIF_PROVIDER'))
          if not has_creds and not wif_configured:
              raise RuntimeError(
                  'FATAL: Model canary requires active GCP credentials. '
                  'Configure WIF_PROVIDER and WIF_SERVICE_ACCOUNT in GitHub Actions secrets.'
              )
          from catcher_in_the_rag.providers.factory import get_llm_provider
          for model_id in ['gemini-3.5-flash', 'gemini-3.8-flash']:
              provider = get_llm_provider(provider_type='vertex_ai', model_id=model_id)
              assert provider.provider_type == 'vertex_ai', f'Expected vertex_ai provider, got {provider.provider_type}'
              health = provider.check_model_health()
              print(f'Model {model_id} Health Status:', health)
              assert health['status'] == 'healthy', f'Unhealthy model {model_id}: {health}'
          "
        env:
          LLM_PROVIDER: "vertex_ai"
          GOOGLE_CLOUD_PROJECT: ${{ env.GCP_PROJECT_ID != '' && env.GCP_PROJECT_ID || 'the-catcher-in-the-rag' }}
          GOOGLE_CLOUD_REGION: "global"

